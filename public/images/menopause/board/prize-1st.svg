<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-label="The Stanley tumbler given as the prize">
  <title>The Stanley tumbler given as the prize</title>
  <defs>
    <!-- Lit from the left, white rolling to a
         warm shadow on the right, so it reads as a cylinder with no outline. -->
    <linearGradient id="otp-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fbf8f4"/>
      <stop offset="70%" stop-color="#eee6dd"/>
      <stop offset="100%" stop-color="#d9cabb"/>
    </linearGradient>
    <linearGradient id="otp-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f1ec"/>
      <stop offset="34%" stop-color="#d7cec3"/>
      <stop offset="62%" stop-color="#b9ab9c"/>
      <stop offset="100%" stop-color="#e6ddd3"/>
    </linearGradient>
    <linearGradient id="otp-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#efe9e2" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#cfc2b4" stop-opacity="0.88"/>
    </linearGradient>
    <clipPath id="otp-upper-clip">
      <path d="M118 128 h170 v232 h-170 z"/>
    </clipPath>
  </defs>

  <!-- Handle: the squared-off loop on the left, drawn behind the body. -->
  <path d="M132 168 h-62 a16 16 0 0 0 -16 16 v134 a16 16 0 0 0 16 16 h62"
        fill="none" stroke="#e2d6c8" stroke-width="30" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M132 168 h-62 a16 16 0 0 0 -16 16 v134 a16 16 0 0 0 16 16 h62"
        fill="none" stroke="#fdfbf8" stroke-width="15" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Lid: the clear cap, its straw nub, and the steel collar under it. -->
  <circle cx="196" cy="50" r="11" fill="#fbf8f4"/>
  <rect x="122" y="56" width="162" height="48" rx="20" fill="url(#otp-lid)"/>
  <rect x="130" y="62" width="70" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
  <rect x="118" y="96" width="170" height="34" rx="8" fill="url(#otp-steel)"/>

  <!-- Body: the wide upper barrel, the ridge, then the narrower base. -->
  <path d="M118 124 h170 v236 l-22 22 v72 a14 14 0 0 1 -14 14 h-98
           a14 14 0 0 1 -14 -14 v-72 l-22 -22 z"
        fill="url(#otp-body)"/>

  <g clip-path="url(#otp-upper-clip)">
    <rect x="140" y="124" width="18" height="236" rx="9" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- The ridge where the barrel steps down to the base. -->
  <rect x="118" y="352" width="170" height="10" fill="#d8c9ba" opacity="0.55"/>

  <!-- Engraving left BLANK on purpose. The quiz night's tumbler is engraved
       for that night; what this campaign's prize will say is not known here,
       and putting words on it that the winner then does not find on the real
       thing is worse than putting none. Add a <text> block here when it is. -->
</svg>
